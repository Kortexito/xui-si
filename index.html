<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>XUI</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080808; }
    body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; }
    img { display: block; width: min(100vw, 100vh); width: min(100vw, 100svh); height: auto; }
  </style>
</head>
<body>
  <img src="xui.png" alt="XUI" width="1024" height="1024">
</body>
</html>
